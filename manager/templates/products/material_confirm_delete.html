{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <h1>Удаление материала</h1>
    
    <div style="padding: 20px; border: 1px solid #ddd; border-radius: 8px; max-width: 600px;">
        <p>Вы уверены, что хотите удалить материал "<strong>{{ material.material_names }}</strong>"?</p>
        
        <form method="POST">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Удалить</button>
            <a href="{% url 'products:product_list' %}" class="btn">Отмена</a>
        </form>
    </div>
</div>
{% endblock %}
